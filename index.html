<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AI Series Thai V5.1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0e14;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}
.wrap{max-width:520px;margin:auto;padding:16px 13px 42px}
.card{background:#161a23;border:1px solid #293042;border-radius:22px;padding:16px;margin:12px 0}
h1{font-size:25px;margin:4px 0}.muted{color:#aab3c5;font-size:13px;line-height:1.5}
label{display:block;margin:14px 0 7px;color:#d8deea;font-size:14px}
input,textarea,select{width:100%;background:#0e121a;color:#fff;border:1px solid #343d51;border-radius:13px;padding:12px;font-size:16px}
textarea{min-height:105px}
img,video{width:100%;border-radius:16px;background:#07090d}
.preview{aspect-ratio:9/16;object-fit:cover}
button{width:100%;border:0;border-radius:15px;padding:15px;margin-top:14px;background:#fff;color:#101216;font-size:17px;font-weight:800}
button:disabled{opacity:.55}
.steps{font-size:14px;line-height:1.8;color:#c6cfdf}
.status{margin-top:12px;white-space:pre-wrap;color:#b8c2d4;font-size:14px}
.success{color:#8ff0b1}
.error{color:#ff9c9c}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🎬 AI Series Thai V5.1</h1>
    <div class="muted">เวอร์ชันแก้ไข: สร้างการเคลื่อนไหวจริง → เสียงไทย → ปากตรงเสียง → MP4</div>
  </div>

  <div class="card">
    <img class="preview" src="/sample/scene1.png" alt="ฉากตอนที่ 1">
  </div>

  <div class="card">
    <label>บทพูดภาษาไทย</label>
    <textarea id="speech">วันนี้ผมจะทำให้ดีที่สุด ไม่ว่าใครจะมองว่าผมเป็นแค่คนงานก็ตาม</textarea>

    <label>การเคลื่อนไหว</label>
    <textarea id="motion">คนงานหายใจและกะพริบตาอย่างเป็นธรรมชาติ ขยับศีรษะและไหล่เล็กน้อย มองไปด้านข้าง แล้วหันกลับมาช้า ๆ กล้องค่อย ๆ ดันเข้าแบบภาพยนตร์ รักษาใบหน้าและตัวตนให้เหมือนภาพต้นฉบับ</textarea>

    <label>เสียง</label>
    <select id="voice">
      <option value="Charon">Charon — ชาย สุขุม</option>
      <option value="Orus">Orus — ชาย จริงจัง</option>
      <option value="Puck">Puck — ชาย มีพลัง</option>
      <option value="Kore">Kore — หญิง หนักแน่น</option>
      <option value="Zephyr">Zephyr — หญิง ใส/ชัด</option>
    </select>

    <label>ความยาวคลิป</label>
    <select id="seconds">
      <option value="5">5 วินาที — ทดสอบ</option>
      <option value="8">8 วินาที</option>
      <option value="10">10 วินาที</option>
    </select>

    <label>เปลี่ยนรูปได้ (ไม่เลือก = ใช้รูปตัวอย่าง)</label>
    <input id="image" type="file" accept="image/png,image/jpeg,image/webp">

    <button id="go">▶ สร้างวิดีโอเคลื่อนไหว</button>
    <div id="status" class="status"></div>
    <div id="result"></div>
  </div>

  <div class="card">
    <div class="steps">
      <b>ระบบทำงาน 4 ขั้น</b><br>
      ① ภาพนิ่ง → วิดีโอเคลื่อนไหวจริง<br>
      ② ข้อความ → เสียงพูดภาษาไทย<br>
      ③ วิดีโอ → ปากตรงเสียง<br>
      ④ ส่งออก MP4
    </div>
  </div>
</div>

<script>
const go = document.getElementById("go");
const status = document.getElementById("status");
const result = document.getElementById("result");

go.addEventListener("click", async () => {
  go.disabled = true;
  result.innerHTML = "";
  status.className = "status";
  status.textContent = "⏳ เริ่มสร้าง...\\n① กำลังสร้างการเคลื่อนไหวจากภาพ\\n② กำลังสร้างเสียงภาษาไทย\\n③ กำลังทำ Lip-sync\\n④ กำลังเตรียม MP4";

  const fd = new FormData();
  fd.append("speech", document.getElementById("speech").value);
  fd.append("motionPrompt", document.getElementById("motion").value);
  fd.append("voice", document.getElementById("voice").value);
  fd.append("seconds", document.getElementById("seconds").value);
  const f = document.getElementById("image").files[0];
  if (f) fd.append("image", f);

  try {
    const r = await fetch("/api/generate", {method:"POST", body:fd});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "สร้างวิดีโอไม่สำเร็จ");

    status.className = "status success";
    status.textContent = "✅ เสร็จแล้ว — วิดีโอมีการเคลื่อนไหวและ Lip-sync";
    result.innerHTML =
      `<video controls playsinline src="${data.videoUrl}"></video>
       <a href="${data.videoUrl}" target="_blank" style="display:block;color:#fff;text-align:center;margin-top:12px">เปิด MP4</a>`;
  } catch (e) {
    status.className = "status error";
    status.textContent = "❌ " + e.message;
  } finally {
    go.disabled = false;
  }
});
</script>
</body>
</html>
